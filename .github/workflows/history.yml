name: Chart history

# Grok Bot writes status.json on the data branch. This rebuilds history.json
# from those commits so the chart keeps going. The push does not include
# status.json, so this workflow does not run again on its own commit.
# Vercel is set not to deploy `data`, so these writes never spend a build.
#
# Two status pushes a few seconds apart used to start two of these jobs.
# Both tried to push history.json; one lost and GitHub mailed a failure.
on:
  push:
    branches: [data]
    paths:
      - status.json

concurrency:
  group: gridboard-chart-history
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: data
      - name: Rebuild history.json
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          attempt=1
          while [ "$attempt" -le 5 ]; do
            git fetch origin data
            git reset --hard origin/data
            python3 scripts/build-history.py
            git add history.json
            if git diff --cached --quiet; then
              echo "history.json already current"
              exit 0
            fi
            git commit -m "Update GridBoard history [skip vercel]"
            if git push origin HEAD:data; then
              exit 0
            fi
            echo "push rejected, retry $attempt"
            attempt=$((attempt + 1))
            sleep 3
          done
          echo "could not push history.json"
          exit 1
