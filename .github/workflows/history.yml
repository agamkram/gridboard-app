name: Chart history

# Grok Bot writes status.json on the data branch. This rebuilds history.json
# from those commits so the chart keeps going. The push does not include
# status.json, so this workflow does not run again on its own commit.
# Vercel is set not to deploy `data`, so these writes never spend a build.
on:
  push:
    branches: [data]
    paths:
      - status.json

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: data
      - name: Rebuild history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin data
          python3 scripts/build-history.py
          git add history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update GridBoard history [skip vercel]"
          git push origin HEAD:data
